services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-workbench-postgres
    environment:
      POSTGRES_DB: rag_workbench
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_workbench"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  rag_pgdata:
