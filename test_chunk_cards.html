<!doctype html><html><head><meta charset="utf-8"><style>
:root{--studio-border:#dfe2e6;--studio-muted:#6f7782;--studio-subtle:#8a919b;}
body{margin:20px;font-family:Arial,sans-serif;background:#f7f7f8}.wrap{width:350px;background:#fbfbfc;border:1px solid #ddd;padding:10px}
.stage5-chunk-list {min-height:0;max-height:610px;overflow-y:auto;padding:0 8px 9px;display:flex;flex-direction:column;gap:8px;scrollbar-gutter:stable;}
.stage5-chunk-item {width:100%;min-height:92px;flex:0 0 auto;border:1px solid var(--studio-border);border-radius:9px;background:white;padding:9px 10px 10px;text-align:left;cursor:pointer;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px;overflow:hidden;box-sizing:border-box;}
.stage5-chunk-item-top,.stage5-chunk-item-meta{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px}.stage5-chunk-item-top strong{min-width:0;font-size:10px;line-height:1.25}.stage5-chunk-item-top em{flex:0 0 auto;color:var(--studio-muted);font-size:8px;font-style:normal;white-space:nowrap}.stage5-chunk-type-pill{min-width:0;max-width:72%;min-height:19px;display:inline-flex;align-items:center;padding:0 7px;border:1px solid #e5def7;border-radius:999px;background:#f7f4ff;color:#5d45a6;font-size:7.5px;font-weight:780;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage5-chunk-item-meta>span:last-child{flex:0 0 auto;color:var(--studio-subtle);font-size:8px;white-space:nowrap}.stage5-chunk-preview{min-width:0;min-height:0;display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;color:#474c55;font-size:9px;line-height:1.45;overflow-wrap:anywhere}
</style></head><body><div class="wrap"><div class="stage5-chunk-list">
<script>for(let i=1;i<=12;i++){document.write(`<button class="stage5-chunk-item"><span class="stage5-chunk-item-top"><strong>Chunk ${i}</strong><em>${30+i*7} est. tokens</em></span><span class="stage5-chunk-item-meta"><span class="stage5-chunk-type-pill">${i%4===0?'Definition':i%3===0?'Table':i%2===0?'Clause':'Figure'}</span><span>p${i}</span></span><span class="stage5-chunk-preview">This is retrieval preview text for chunk ${i}. It stays inside the card and is clamped to two lines so metadata never leaks into adjacent rows.</span></button>`)}</script>
</div></div></body></html>
